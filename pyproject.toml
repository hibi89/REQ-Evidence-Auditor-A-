[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "req-evidence-auditor"
version = "0.1.0"
description = "Offline-first REQ-to-code static evidence candidate auditor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reqea = "reqea.cli:main"
reqea-gui = "reqea.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reqea", "reqea.*", "reqea_codegraph", "reqea_codegraph.*", "reqea_evidence", "reqea_evidence.*"]
