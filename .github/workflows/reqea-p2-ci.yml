name: REQEA P2 synthetic cross-platform verification
on:
  push:
    branches: [integration/reqea-p1-20261118]
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/reqea-p2-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m compileall -q src tests
      - name: Windows synthetic handle identity diagnostic
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import os, stat, tempfile
          from pathlib import Path
          from reqea_codegraph.walk import scan_tree
          from reqea_codegraph.files import read_file
          with tempfile.TemporaryDirectory() as d:
              p = Path(d) / "probe.py"
              p.write_text("def test(): return 1", encoding="utf-8")
              scan = scan_tree(d, {})
              print("entries:", len(scan.files))
              if scan.files:
                  entry = scan.files[0]
                  before = p.lstat()
                  fd = os.open(p, os.O_RDONLY | getattr(os, "O_BINARY", 0))
                  try: opened = os.fstat(fd)
                  finally: os.close(fd)
                  print("entry dev/ino/size:", entry.device, entry.inode, entry.size)
                  print("lstat dev/ino/size/links:", before.st_dev, before.st_ino, before.st_size, before.st_nlink)
                  print("fstat dev/ino/size/links:", opened.st_dev, opened.st_ino, opened.st_size, opened.st_nlink)
                  try: print("read bytes:", read_file(Path(d), entry, 100).record["bytes"])
                  except ValueError as e: print("read rejection:", type(e).__name__, str(e))
          PY
      - name: B C A and P2 complete synthetic suites
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/b -v
          python -m unittest discover -s tests/c -v
          python -m unittest discover -s tests/integration -v
          python -m unittest discover -s tests/p2 -v
      - name: Package installable wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir ./local-wheel .
      - name: No artifact publication
        run: echo "Synthetic fixtures only; no source/customer file artifacts uploaded."

  windows-exe:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local-only unsigned CLI and GUI EXE construction
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pyinstaller>=6.10,<7"
          python -m PyInstaller --noconfirm --clean --onefile --name reqea-cli --paths src --hidden-import reqea_codegraph --hidden-import reqea_evidence src/reqea/entry_cli.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name reqea-gui --paths src --hidden-import reqea_codegraph --hidden-import reqea_evidence src/reqea/entry_gui.py
      - name: Execute CLI EXE on synthetic Unicode Windows project
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path
          cli = Path("dist/reqea-cli.exe").absolute()
          gui = Path("dist/reqea-gui.exe").absolute()
          assert cli.is_file() and gui.is_file()
          help_result = subprocess.run([str(cli), "--help"], capture_output=True, text=True, timeout=45)
          assert help_result.returncode == 0, (help_result.returncode, help_result.stderr)
          with tempfile.TemporaryDirectory() as d:
              parent = Path(d)
              root = parent / "synthetic 한글 프로젝트"
              (root / "src").mkdir(parents=True)
              (root / "src" / "app.py").write_bytes(b"def run():\n    return 1\n")
              req = root / "requirements.md"
              req.write_text("# REQ-001 - synthetic\nReference src/app.py\nAcceptance criteria:\n- static exists\n", encoding="utf-8")
              out = parent / "output"
              result = subprocess.run([str(cli), "audit", "--repo", str(root),
                                       "--requirements", str(req), "--out", str(out)],
                                      capture_output=True, text=True, timeout=60)
              assert result.returncode == 0, (result.returncode, result.stderr)
              assert json.loads((out / "audit.json").read_text(encoding="utf-8"))["schema_version"] == "reqea.v1"
              assert (out / "report.html").is_file() and (out / "manifest.json").is_file()
              print("Windows unsigned CLI EXE synthetic audit PASS; GUI EXE built but GUI live automation NOT_RUN")
          PY
      - name: Ephemeral only; never upload unsigned EXE or reports
        run: echo "Portable EXE files remain on runner only. No artifact upload or release."
